<script>
const items=[];for(let i=1;i<=66;i++)items.push({t:'door',s:`article${i}.png`,c:`Article ${i}`});
for(let i=1;i<=4;i++)items.push({t:'beading',s:`beading${i}.png`,c:`Beading ${i}`});items.push({t:'frame',s:'frame1.png',c:'Frame 1'});

g.innerHTML=items.map((x,k)=>`<div class="cd art" data-t="${x.t}" data-c="${x.c.toLowerCase()}"><div class="iw" data-k="${k}"><img src="${x.s}" alt="Fiber ${x.t} ${x.c} - Pak Fiber Doors" loading="lazy" onerror="this.style.opacity=0"></div><div class="tx"><h3>${x.c}</h3><a class="btn b-g" target="_blank" rel="noopener" href="${W(x)}">Buy on WhatsApp</a></div></div>`).join('');
const cs=$$('.art');let f='all',q='',vis=[];
function ap(){vis=[];cs.forEach((c,k)=>{const ok=(f=='all'||c.dataset.t==f)&&c.dataset.c.includes(q);c.style.display=ok?'':'none';if(ok)vis.push(items[k])});$('#em').style.display=vis.length?'none':'block';$('#n').textContent=vis.length+' designs'}
$$('.fl button').forEach(b=>b.onclick=()=>{f=b.dataset.f;$$('.fl button').forEach(x=>x.classList.toggle('on',x==b));ap()});
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();ap()};
g.onclick=e=>{const w=e.target.closest('.iw');if(!w)return;const x=items[+w.dataset.k];LB(vis.map(v=>({s:v.s,c:v.c,w:W(v)})),vis.indexOf(x))};
const h=location.hash.slice(1);if(['door','beading','frame'].includes(h)){f=h;$$('.fl button').forEach(x=>x.classList.toggle('on',x.dataset.f==h))}ap();
